schema_version: 1.0.0
name: tedarik-ve-malzeme-karsilastirma
version: 0.1.0
language: tr
display_name: Tedarik ve Malzeme Karşılaştırma
description: İnşaat tedarik, RFQ, tedarikçi teklif karşılaştırma, malzeme teknik uygunluk, datasheet/sertifika/numune kontrolü,
  fiyat-termin-stok-risk analizi ve satın alma karar tablosu hazırlamak için kullanılır.
entrypoint: SKILL.md
default_prompt: Tedarik ve Malzeme Karşılaştırma skillini kullanarak kullanıcının inşaat operasyonu talebini analiz et, uygun
  araç rotasını seç, çıktı sınırlarını ve gerekli insan onaylarını belirt.
tags:
- tedarik
- malzeme
- rfq
- supplier
- datasheet
- sertifika
triggers:
- tedarikçi karşılaştır
- malzeme teknik uygunluk
- RFQ
- datasheet sertifika kontrolü
inputs:
- supplier_quotes
- material_specs
- datasheets
- certificates
- delivery_terms
outputs:
- supplier_comparison
- material_compliance_matrix
- procurement_risk_report
guardrails:
- Kaynak, varsayım, eksik veri ve çıktı sınırları açık yazılmalıdır.
- Bu skill karar destek ve çıktı hazırlama amacı taşır; yetkili onay yerine geçmez.
- Hukuki, finansal, İSG, teknik veya üçüncü taraf taahhüdü doğuran kararlar insan onayı gerektirir.
- Fiyat, ödeme, satın alma ve hakediş çıktıları yetkili finans/ticari onay gerektirir.
- Yüksek riskli çıktılarda nihai karar kullanıcı veya yetkili uzman tarafından doğrulanmalıdır.
risk_level: high
requires_human_approval: true
human_approval_contexts:
- teknik, mali, hukuki, İSG veya sözleşmesel nihai karar
- üçüncü taraf gönderimi veya şirket adına taahhüt
- resmi onay, ödeme, satın alma, hakediş, teslim veya uygunluk beyanı
tools:
- name: check_procurement_tools
  type: cli
  path: scripts/check_procurement_tools.py
  command: python scripts/check_procurement_tools.py
- name: compare_material_specs
  type: cli
  path: scripts/compare_material_specs.py
  command: python scripts/compare_material_specs.py
- name: compare_supplier_quotes
  type: cli
  path: scripts/compare_supplier_quotes.py
  command: python scripts/compare_supplier_quotes.py
- name: plan_procurement_route
  type: cli
  path: scripts/plan_procurement_route.py
  command: python scripts/plan_procurement_route.py
related_skills:
- teklif-ve-maliyet-tablolama
- teknik-sartname-ve-uygulama-kontrolu
