name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate skill manifests
        run: python scripts/validate_skill_manifest.py --format markdown

      - name: Run tests
        run: python -m pytest

      - name: Build release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          fi
          python scripts/build_release_artifacts.py --version "$VERSION" --output-dir dist/release --format json

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: insaat-skill-release
          path: |
            dist/release/insaat-skill-seti.zip
            dist/release/SHA256SUMS.txt
            dist/release/release-metadata.json
            dist/release/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/release/insaat-skill-seti.zip dist/release/SHA256SUMS.txt dist/release/release-metadata.json --clobber
            gh release edit "$VERSION" --title "Insaat Skill Seti ${VERSION}" --notes-file dist/release/release-notes.md
          else
            gh release create "$VERSION" dist/release/insaat-skill-seti.zip dist/release/SHA256SUMS.txt dist/release/release-metadata.json --title "Insaat Skill Seti ${VERSION}" --notes-file dist/release/release-notes.md --target "${GITHUB_SHA}"
          fi
