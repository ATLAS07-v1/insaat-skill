name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate skill manifests
        run: python scripts/validate_skill_manifest.py --format markdown

      - name: Run tests
        run: python -m pytest

      - name: Run quickstart examples
        run: python scripts/run_examples.py --scenario quickstart --output-dir dist/example-runs/ci-quickstart --format json

      - name: Build and verify release package
        run: |
          python scripts/build_release_artifacts.py --version v0.1.1 --output-dir dist/release --format json
          python scripts/verify_release_package.py dist/release/insaat-skill-seti.zip --work-dir dist/release-verify --format json
