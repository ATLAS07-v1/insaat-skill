schema_version: 1.0.0
name: risk-guvenlik-ve-uygunluk-denetimi
version: 0.1.0
language: tr
display_name: Risk Güvenlik ve Uygunluk Denetimi
description: İnşaat risk kaydı, İSG saha denetimi, çalışma izni, uygunsuzluk, kanıt/evidence kontrolü, BIM/IFC IDS uyumluluk
  denetimi, BCF issue ve kapatma aksiyonu hazırlamak için kullanılır.
entrypoint: SKILL.md
default_prompt: Risk Güvenlik ve Uygunluk Denetimi skillini kullanarak kullanıcının inşaat operasyonu talebini analiz et,
  uygun araç rotasını seç, çıktı sınırlarını ve gerekli insan onaylarını belirt.
tags:
- risk
- isg
- uygunluk
- kanit
- denetim
- bcf
triggers:
- risk değerlendirmesi
- İSG denetimi
- uygunluk kontrolü
- kanıt matrisi
inputs:
- risk_register
- compliance_checklist
- evidence_register
- method_statement
- permit_to_work
outputs:
- risk_score_report
- compliance_audit
- nonconformance_action_plan
- evidence_gap_matrix
guardrails:
- Kaynak, varsayım, eksik veri ve çıktı sınırları açık yazılmalıdır.
- Bu skill karar destek ve çıktı hazırlama amacı taşır; yetkili onay yerine geçmez.
- Hukuki, finansal, İSG, teknik veya üçüncü taraf taahhüdü doğuran kararlar insan onayı gerektirir.
- Resmi İSG, hukuk veya yapı denetim uygunluğu kesin ifade edilmez.
- Yüksek riskli çıktılarda nihai karar kullanıcı veya yetkili uzman tarafından doğrulanmalıdır.
risk_level: high
requires_human_approval: true
human_approval_contexts:
- teknik, mali, hukuki, İSG veya sözleşmesel nihai karar
- üçüncü taraf gönderimi veya şirket adına taahhüt
- resmi onay, ödeme, satın alma, hakediş, teslim veya uygunluk beyanı
tools:
- name: audit_compliance_checklist
  type: cli
  path: scripts/audit_compliance_checklist.py
  command: python scripts/audit_compliance_checklist.py
- name: check_risk_compliance_tools
  type: cli
  path: scripts/check_risk_compliance_tools.py
  command: python scripts/check_risk_compliance_tools.py
- name: plan_risk_compliance_route
  type: cli
  path: scripts/plan_risk_compliance_route.py
  command: python scripts/plan_risk_compliance_route.py
- name: score_risk_register
  type: cli
  path: scripts/score_risk_register.py
  command: python scripts/score_risk_register.py
related_skills:
- saha-fotograf-ve-kanit-analizi
- teknik-sartname-ve-uygulama-kontrolu
