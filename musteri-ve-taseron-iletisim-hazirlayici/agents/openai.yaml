schema_version: 1.0.0
name: musteri-ve-taseron-iletisim-hazirlayici
version: 0.1.0
language: tr
display_name: Müşteri ve Taşeron İletişim Hazırlayıcı
description: İnşaat projelerinde müşteri, işveren, taşeron, tedarikçi ve proje ekibi için RFI, submittal, transmittal, toplantı
  tutanağı, saha talimatı, aksiyon takibi, durum güncellemesi, gecikme/variasyon taslağı ve resmi olmayan iletişim paketleri
  hazırlamak için kullanılır.
entrypoint: SKILL.md
default_prompt: Müşteri ve Taşeron İletişim Hazırlayıcı skillini kullanarak kullanıcının inşaat operasyonu talebini analiz
  et, uygun araç rotasını seç, çıktı sınırlarını ve gerekli insan onaylarını belirt.
python_requires: '>=3.10'
dependency_groups:
- core
- communication
- pdf-doc
- spreadsheet
system_tools:
- Pandoc
- LibreOffice
tags:
- iletisim
- musteri
- taseron
- rfi
- submittal
- toplanti
triggers:
- müşteri e-postası
- taşeron mesajı
- RFI taslağı
- toplantı tutanağı
- aksiyon takibi
inputs:
- project_context
- recipient
- communication_type
- facts
- references
- attachments
outputs:
- message_draft
- meeting_minutes
- action_list
- communication_risk_check
guardrails:
- Kaynak, varsayım, eksik veri ve çıktı sınırları açık yazılmalıdır.
- Bu skill karar destek ve çıktı hazırlama amacı taşır; yetkili onay yerine geçmez.
- Hukuki, finansal, İSG, teknik veya üçüncü taraf taahhüdü doğuran kararlar insan onayı gerektirir.
- Bu skill üçüncü taraflara mesaj göndermez; yalnızca taslak ve kontrol çıktısı üretir.
- Yüksek riskli çıktılarda nihai karar kullanıcı veya yetkili uzman tarafından doğrulanmalıdır.
risk_level: high
requires_human_approval: true
human_approval_contexts:
- teknik, mali, hukuki, İSG veya sözleşmesel nihai karar
- üçüncü taraf gönderimi veya şirket adına taahhüt
- resmi onay, ödeme, satın alma, hakediş, teslim veya uygunluk beyanı
tools:
- name: check_communication_tools
  type: cli
  path: scripts/check_communication_tools.py
  command: python scripts/check_communication_tools.py
- name: draft_construction_message
  type: cli
  path: scripts/draft_construction_message.py
  command: python scripts/draft_construction_message.py
- name: plan_communication_route
  type: cli
  path: scripts/plan_communication_route.py
  command: python scripts/plan_communication_route.py
- name: validate_communication_pack
  type: cli
  path: scripts/validate_communication_pack.py
  command: python scripts/validate_communication_pack.py
related_skills:
- dokuman-standartlastirma-ve-formatlama
- risk-guvenlik-ve-uygunluk-denetimi
