schema_version: 1.0.0
name: insaat-hesaplamalar
version: 0.1.1
language: tr
display_name: İnşaat Hesaplamalar
description: İnşaat, mimari, kaba yapı, ince işler, metraj, malzeme, alan, hacim, kazı-dolgu, beton, kalıp, donatı, birim
  dönüşümü, ön taşıyıcı sistem hesabı ve hesap kontrol raporu hazırlamak için kullanılır; mühendislik onayı yerine geçmez.
entrypoint: SKILL.md
default_prompt: İnşaat Hesaplamalar skillini kullanarak kullanıcının inşaat operasyonu talebini analiz et, uygun araç rotasını
  seç, çıktı sınırlarını ve gerekli insan onaylarını belirt.
python_requires: '>=3.10'
dependency_groups:
- core
- spreadsheet
system_tools: []
tags:
- hesaplama
- metraj
- malzeme
- birim
- varsayim
- formul
triggers:
- inşaat hesabı
- malzeme hesabı
- alan hacim ağırlık
- beton donatı kalıp hesapla
inputs:
- calculation_request
- dimensions
- units
- assumptions
- material_specs
outputs:
- calculation_result
- assumption_log
- unit_check
- risk_notes
guardrails:
- Kaynak, varsayım, eksik veri ve çıktı sınırları açık yazılmalıdır.
- Bu skill karar destek ve çıktı hazırlama amacı taşır; yetkili onay yerine geçmez.
- Hukuki, finansal, İSG, teknik veya üçüncü taraf taahhüdü doğuran kararlar insan onayı gerektirir.
- Yüksek riskli çıktılarda nihai karar kullanıcı veya yetkili uzman tarafından doğrulanmalıdır.
risk_level: high
requires_human_approval: true
human_approval_contexts:
- teknik, mali, hukuki, İSG veya sözleşmesel nihai karar
- üçüncü taraf gönderimi veya şirket adına taahhüt
- resmi onay, ödeme, satın alma, hakediş, teslim veya uygunluk beyanı
sandbox_required: false
execution_mode: local_cli
max_runtime_seconds: 180
network_access: none
writes_files: true
resource_limits:
  max_input_size_mb: 100
  max_output_size_mb: 100
  recommended_memory_mb: 512
tools:
- name: basic_quantity_calculator
  type: cli
  path: scripts/basic_quantity_calculator.py
  command: python scripts/basic_quantity_calculator.py
- name: check_calculation_tools
  type: cli
  path: scripts/check_calculation_tools.py
  command: python scripts/check_calculation_tools.py
- name: plan_calculation_route
  type: cli
  path: scripts/plan_calculation_route.py
  command: python scripts/plan_calculation_route.py
related_skills:
- metraj-ve-mahal-kontrolu
- teklif-ve-maliyet-tablolama
