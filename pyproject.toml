[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insaat-skill-seti"
version = "0.1.0"
description = "Construction AI skill set for Hermes/Codex-style agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2",
  "Pillow>=10.4.0",
  "pypdf>=4.3.0",
  "pandas>=2.2.0",
  "XlsxWriter>=3.2.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
cad = [
  "ezdxf[draw]>=1.3.4"
]
bim = [
  "ifcopenshell>=0.8.0"
]
pdf-doc = [
  "python-docx>=1.1.2",
  "pdfplumber>=0.11.4",
  "PyMuPDF>=1.24.10",
  "markdown>=3.7",
  "odfpy>=1.4.1",
  "lxml>=5.3.0"
]
spreadsheet = [
  "openpyxl>=3.1.5",
  "numpy>=1.26.4"
]
image-ocr = [
  "opencv-python>=4.10.0.84",
  "imagehash>=4.3.1",
  "pytesseract>=0.3.13",
  "scikit-image>=0.24.0",
  "exifread>=3.0.0",
  "piexif>=1.1.3",
  "rawpy>=0.21.0",
  "geopandas>=1.0.1"
]
data-quality = [
  "jsonschema>=4.23.0",
  "frictionless>=5.17.0",
  "great-expectations>=1.0.0",
  "rapidfuzz>=3.9.7"
]
communication = [
  "Jinja2>=3.1.4",
  "email-validator>=2.2.0"
]
dev = [
  "pytest>=8.3.0",
  "jsonschema>=4.23.0"
]
all = [
  "ezdxf[draw]>=1.3.4",
  "ifcopenshell>=0.8.0",
  "python-docx>=1.1.2",
  "pdfplumber>=0.11.4",
  "PyMuPDF>=1.24.10",
  "markdown>=3.7",
  "odfpy>=1.4.1",
  "lxml>=5.3.0",
  "openpyxl>=3.1.5",
  "numpy>=1.26.4",
  "opencv-python>=4.10.0.84",
  "imagehash>=4.3.1",
  "pytesseract>=0.3.13",
  "scikit-image>=0.24.0",
  "exifread>=3.0.0",
  "piexif>=1.1.3",
  "rawpy>=0.21.0",
  "geopandas>=1.0.1",
  "jsonschema>=4.23.0",
  "frictionless>=5.17.0",
  "great-expectations>=1.0.0",
  "rapidfuzz>=3.9.7",
  "Jinja2>=3.1.4",
  "email-validator>=2.2.0",
  "pytest>=8.3.0"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
