schema_version: 1.0.0
name: saha-fotograf-ve-kanit-analizi
version: 0.1.0
language: tr
display_name: Saha Fotoğraf ve Kanıt Analizi
description: İnşaat saha fotoğrafları, video kareleri ve görsel kanıtlar için EXIF/metadata, hash, OCR, mahal/konum, ilerleme,
  kalite, İSG, uygunsuzluk, önce-sonra karşılaştırma, drone görselleri ve kanıt register analizi hazırlamak için kullanılır.
entrypoint: SKILL.md
default_prompt: Saha Fotoğraf ve Kanıt Analizi skillini kullanarak kullanıcının inşaat operasyonu talebini analiz et, uygun
  araç rotasını seç, çıktı sınırlarını ve gerekli insan onaylarını belirt.
tags:
- saha-fotografi
- kanit
- exif
- ocr
- privacy
- drone
triggers:
- saha fotoğrafı
- kanıt analizi
- EXIF metadata
- fotoğraf register
- duplicate foto
inputs:
- photo_folder
- image_files
- project_context
- evidence_register
- annotations
outputs:
- photo_evidence_register
- metadata_integrity_report
- visual_findings
- privacy_flags
guardrails:
- Kaynak, varsayım, eksik veri ve çıktı sınırları açık yazılmalıdır.
- Bu skill karar destek ve çıktı hazırlama amacı taşır; yetkili onay yerine geçmez.
- Hukuki, finansal, İSG, teknik veya üçüncü taraf taahhüdü doğuran kararlar insan onayı gerektirir.
- Kişisel veri, GPS, yüz, plaka ve hassas saha bilgileri paylaşım öncesi kontrol edilmelidir.
- Yüksek riskli çıktılarda nihai karar kullanıcı veya yetkili uzman tarafından doğrulanmalıdır.
risk_level: high
requires_human_approval: true
human_approval_contexts:
- teknik, mali, hukuki, İSG veya sözleşmesel nihai karar
- üçüncü taraf gönderimi veya şirket adına taahhüt
- resmi onay, ödeme, satın alma, hakediş, teslim veya uygunluk beyanı
tools:
- name: build_photo_evidence_register
  type: cli
  path: scripts/build_photo_evidence_register.py
  command: python scripts/build_photo_evidence_register.py
- name: check_photo_evidence_tools
  type: cli
  path: scripts/check_photo_evidence_tools.py
  command: python scripts/check_photo_evidence_tools.py
- name: plan_photo_evidence_route
  type: cli
  path: scripts/plan_photo_evidence_route.py
  command: python scripts/plan_photo_evidence_route.py
- name: validate_photo_evidence_register
  type: cli
  path: scripts/validate_photo_evidence_register.py
  command: python scripts/validate_photo_evidence_register.py
related_skills:
- risk-guvenlik-ve-uygunluk-denetimi
- musteri-ve-taseron-iletisim-hazirlayici
